# Paths are relative to internal/api, where go:generate runs.
packages:
  - path: slate/internal/api
    output_path: ../../../frontend/src/api/generated.ts
    type_mappings:
      time.Time: string
      json.RawMessage: unknown
    enum_style: union
    exclude_files: [optional.go]
    frontmatter: |
      // Generated by tygo from backend/internal/api. Do not edit; run `go generate ./internal/api`.
      // Pointer fields are optional here but arrive as null in responses.
      export type JsonObject = Record<string, unknown>;
