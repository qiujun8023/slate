# Slate 自托管样例：Slate 加一个自带的 PostgreSQL。
#
# 首次启动：
#   1. 在本文件旁创建 .env，写入两项必填配置（可选配置见仓库 backend/README.md）：
#        POSTGRES_PASSWORD=<openssl rand -hex 32 的输出>
#        JWT_SECRET=<openssl rand -hex 64 的输出>
#   2. mkdir -p slate postgres && sudo chown -R 1000:1000 slate   # Slate 容器以 uid 1000 运行
#   3. docker compose up -d                                         # 启动时自动建表、迁移
#   4. 浏览器打开 http://<主机>:9494/register 注册第一个账号
#
# 升级：docker compose pull && docker compose up -d
# 从 v0.1.x（MySQL）迁移：见仓库 README「从 v0.1.x 升级」。
#
# 数据：./slate/blobs（图片、音频）和 ./postgres。备份 = pg_dump + 打包 ./slate。
# 已有 PostgreSQL 时删掉 postgres 服务，把 DATABASE_URL 指过去；放在反向代理后面时
# 可以把端口改成 127.0.0.1:9494:9494，只让代理访问。

services:
  slate:
    image: ghcr.io/qiujun8023/slate:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '9494:9494'
    volumes:
      - ./slate:/data
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://slate:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/slate

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: slate
      POSTGRES_USER: slate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slate -d slate']
      interval: 5s
      timeout: 3s
      retries: 12
